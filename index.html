<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bradley Soapery and Co. | Reorder</title>
<meta name="description" content="Reorder handmade soap, cologne, perfume and car scents from Bradley Soapery and Co.">
<style>
  :root { --ink:#2b2420; --soft:#6f635b; --line:#e4dbd2; --bg:#faf6f1; --card:#ffffff; --accent:#7a4b2a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,"Times New Roman",serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  main { max-width:560px; margin:0 auto; padding:28px 18px 60px; }
  header { text-align:center; padding-bottom:18px; border-bottom:1px solid var(--line); }
  h1 { font-size:1.7rem; margin:0 0 4px; letter-spacing:.02em; }
  header p { margin:0; color:var(--soft); font-size:.98rem; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-top:14px; display:flex; align-items:center; gap:12px; }
  .info { flex:1; }
  .name { font-size:1.08rem; font-weight:bold; }
  .desc { color:var(--soft); font-size:.9rem; }
  .price { color:var(--accent); font-size:.98rem; margin-top:2px; }
  .qty { display:flex; align-items:center; gap:8px; }
  .qty button { width:38px; height:38px; border-radius:50%; border:1px solid var(--accent); background:#fff; color:var(--accent); font-size:1.25rem; cursor:pointer; }
  .qty span { min-width:20px; text-align:center; font-size:1.05rem; }
  label { display:block; margin-top:18px; font-size:.95rem; }
  input, textarea { width:100%; margin-top:6px; padding:11px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:76px; }
  .hint { display:block; color:var(--soft); font-size:.88rem; margin-top:3px; }
  .total { margin-top:20px; font-size:1.1rem; display:flex; justify-content:space-between; border-top:1px solid var(--line); padding-top:14px; }
  .send { width:100%; margin-top:16px; padding:15px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-size:1.08rem; cursor:pointer; }
  .send:disabled { opacity:.45; cursor:default; }
  .msg { color:#a03020; font-size:.92rem; margin-top:8px; min-height:1.2em; }
  .pay { display:block; text-align:center; margin-top:12px; padding:14px; border:1px solid var(--accent); border-radius:10px; color:var(--accent); font-size:1.08rem; text-decoration:none; cursor:pointer; }
  [hidden] { display:none !important; }
  footer { margin-top:30px; text-align:center; color:var(--soft); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Bradley Soapery and Co.</h1>
    <p>Handmade in Mississippi. Running low? Reorder here.</p>
  </header>

  <div id="items"></div>

  <label>Your name
    <input id="buyer" autocomplete="name" placeholder="So we know who it's for">
  </label>
  <label>Which ones? (required)
    <span class="hint">For each item, give the product and the scent, or copy the name printed on your label.</span>
    <textarea id="notes" placeholder="Example: 1 cologne, the name on my bottle is ____. 2 soaps, shea butter."></textarea>
  </label>

  <div class="total"><span>Estimated total</span><span id="total">$0</span></div>
  <button class="send" id="send" disabled>Send order, pay at pickup</button>
  <div class="msg" id="msg"></div>
  <a class="pay" id="pay" hidden>Pay here</a>

  <footer>
    Orders are confirmed by reply. Tap Pay here to pay by card, or pay at pickup.<br>
    &copy; <span id="yr"></span> Bradley Soapery and Co., an eHut LLC brand.
  </footer>
</main>

<script>
/* ===== EDIT THIS SECTION ONLY =====
   price: a number, or null to show "Price confirmed by reply".
   ORDER_EMAIL: where orders are sent.
   PAY_LINK: paste a Stripe or Square payment link between the quotes, or leave empty. */
var PRODUCTS = [
  { name: "Handmade soap bar", desc: "Cocoa butter, goat's milk or shea butter", price: 5 },
  { name: "Cologne, 10 ml",    desc: "Spray bottle. Name the scent below", price: 10 },
  { name: "Cologne, 15 ml",    desc: "Spray bottle. Name the scent below", price: 15 },
  { name: "Cologne, 30 ml",    desc: "Glass spray bottle. Name the scent below", price: 30 },
  { name: "Perfume, 10 ml",    desc: "Spray bottle. Name the scent below", price: 10 },
  { name: "Perfume, 15 ml",    desc: "Spray bottle. Name the scent below", price: 15 },
  { name: "Perfume, 30 ml",    desc: "Glass spray bottle. Name the scent below", price: 30 },
  { name: "Car scent",         desc: "Hanging car diffuser. Name the scent below", price: 3 }
];
var ORDER_EMAIL = "ehut_llc@outlook.com";
var PAY_LINK = "https://buy.stripe.com/5kQ6oG11K1qT00n8j25gc07";
/* ===== END OF EDIT SECTION ===== */

var qty = PRODUCTS.map(function () { return 0; });
var box = document.getElementById("items");

PRODUCTS.forEach(function (p, i) {
  var row = document.createElement("div");
  row.className = "item";
  var info = document.createElement("div");
  info.className = "info";
  var n = document.createElement("div"); n.className = "name"; n.textContent = p.name;
  var d = document.createElement("div"); d.className = "desc"; d.textContent = p.desc;
  var pr = document.createElement("div"); pr.className = "price";
  pr.textContent = p.price === null ? "Price confirmed by reply" : "$" + p.price + " each";
  info.appendChild(n); info.appendChild(d); info.appendChild(pr);

  var q = document.createElement("div"); q.className = "qty";
  var minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−";
  minus.setAttribute("aria-label", "One less " + p.name);
  var count = document.createElement("span"); count.textContent = "0";
  var plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+";
  plus.setAttribute("aria-label", "One more " + p.name);
  minus.onclick = function () { if (qty[i] > 0) { qty[i]--; count.textContent = qty[i]; refresh(); } };
  plus.onclick = function () { if (qty[i] < 50) { qty[i]++; count.textContent = qty[i]; refresh(); } };
  q.appendChild(minus); q.appendChild(count); q.appendChild(plus);

  row.appendChild(info); row.appendChild(q);
  box.appendChild(row);
});

function refresh() {
  var sum = 0, unpriced = false, any = false;
  PRODUCTS.forEach(function (p, i) {
    if (qty[i] > 0) { any = true; if (p.price === null) { unpriced = true; } else { sum += p.price * qty[i]; } }
  });
  document.getElementById("total").textContent = "$" + sum + (unpriced ? " + items priced by reply" : "");
  document.getElementById("send").disabled = !any;
  document.getElementById("msg").textContent = "";
}

function orderEmail(payNote) {
  var msg = document.getElementById("msg");
  var lines = [];
  PRODUCTS.forEach(function (p, i) { if (qty[i] > 0) { lines.push(qty[i] + " x " + p.name); } });
  if (!lines.length) { msg.textContent = "Add at least one item first."; return null; }
  var buyer = document.getElementById("buyer").value.trim();
  if (!buyer) { msg.textContent = "Add your name first."; return null; }
  var notes = document.getElementById("notes").value.trim();
  if (!notes) { msg.textContent = "Tell us the scent, or the name on your label."; return null; }
  var body = "Order from " + buyer + "\n\n" + lines.join("\n") +
             "\n\nNotes: " + notes +
             "\n\nEstimated total: " + document.getElementById("total").textContent +
             "\n\nPayment: " + payNote;
  return "mailto:" + ORDER_EMAIL +
    "?subject=" + encodeURIComponent("Soapery order: " + buyer) +
    "&body=" + encodeURIComponent(body);
}

document.getElementById("send").onclick = function () {
  var link = orderEmail("at pickup");
  if (link) { window.location.href = link; }
};

document.getElementById("pay").onclick = function (e) {
  e.preventDefault();
  var link = orderEmail("paying online");
  if (!link) { return; }
  window.open(PAY_LINK, "_blank", "noopener");
  window.location.href = link;
};

document.getElementById("buyer").oninput = function () { document.getElementById("msg").textContent = ""; };
document.getElementById("notes").oninput = function () { document.getElementById("msg").textContent = ""; };
if (PAY_LINK) { var a = document.getElementById("pay"); a.href = PAY_LINK; a.hidden = false; }
document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
